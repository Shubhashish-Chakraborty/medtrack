{% extends "base.html" %}
{% block title %}{% if object %}Edit{% else %}New{% endif %} product · MedTrack{% endblock %}
{% block content %}
  <h1>{% if object %}Edit {{ object.name }}{% else %}New product{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'product-list' %}">Cancel</a>
  </form>
{% endblock %}
